name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install -r requirements-lock.txt failed" }
          python -m pip check

      - name: Compile Python sources
        shell: pwsh
        run: |
          @'
          import py_compile
          from pathlib import Path

          entries = [Path("app.py"), Path("start.py"), Path("install.py")]
          roots = [Path("gantry"), Path("scripts"), Path("tests")]
          missing = [str(path) for path in entries if not path.is_file()]
          missing += [str(path) for path in roots if not path.is_dir()]
          if missing:
              raise SystemExit("Missing required paths: " + ", ".join(missing))

          files = entries[:]
          for root in roots:
              files.extend(sorted(root.rglob("*.py")))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(files)} Python files.")
          '@ | python -

      - name: Prepare config from example
        shell: pwsh
        run: |
          Copy-Item -LiteralPath config.example.json -Destination config.json -Force
          python -c "import json;p='config.json';d=json.load(open(p,encoding='utf-8'));d['api_token']='';json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)"

      - name: Check frontend syntax (AUD-P3, 审核 ⑨-10)
        shell: pwsh
        run: |
          node --version
          # 每个模块文件再按 .mjs 严格解析一次：node --check x.js 对"export 被嵌进
          # 函数体"这类模块级语法错误会放行（2026-11-27 beta.42 线上事故），
          # .mjs 后缀强制 ES 模块解析，嵌套 export 立即报错。
          Get-ChildItem webui\js\*.js | ForEach-Object {
            node --check $_.FullName
            $tmp = Join-Path $env:TEMP ("gantry-esm-" + $_.BaseName + ".mjs")
            Copy-Item -LiteralPath $_.FullName -Destination $tmp -Force
            node --check $tmp
            Remove-Item -LiteralPath $tmp -Force
          }
          node --check webui\boot.js
          node --check webui\i18n.js
          if ($LASTEXITCODE -ne 0) { throw "JS syntax check failed" }

      - name: Check dependency metadata consistency (AUD-P1-16)
        shell: pwsh
        run: |
          @'
          import re, tomllib
          from pathlib import Path
          proj = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = list(proj["project"]["dependencies"])
          for extra in (proj["project"].get("optional-dependencies") or {}).values():
              deps += list(extra)
          names = {re.split(r"[<>=!~; ]", d)[0].lower() for d in deps}
          req = [l for l in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
                 if l.strip() and not l.strip().startswith("#")]
          missing = [r for r in req if re.split(r"[<>=!~; ]", r)[0].lower() not in names]
          if missing:
              raise SystemExit("requirements.txt 里这些依赖不在 pyproject.toml：%s" % ", ".join(missing))
          print("Dependency metadata consistent.")
          '@ | python -

      - name: Run deterministic offline tests
        shell: pwsh
        run: |
          # AUD-P1-17（审核 ⑨-2）：与发布门一致——test_liveview 在 GitHub Windows
          # runner 上稳定挂到 180s（本地 1s），单进程 discover 无每模块超时兜底，
          # 会把整个 job 拖到 20 分钟超时。改用分块运行并同步 skip 策略。
          python scripts/run_tests_chunked.py --timeout 180 --skip test_liveview,test_copilot_file,test_model_menu_scan
