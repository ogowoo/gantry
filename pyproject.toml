[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry"
version = "0.12.0-beta.39"
description = "把 M365 Copilot 网页端桥接成本地 OpenAI 兼容 API + Agent 运行时（含 WebUI、插件、MCP、子代理）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "playwright>=1.48,<2",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "python-calamine>=0.3,<1",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  # AUD-P1-16：与 requirements.txt/lock 对齐（审核 ⑨-4）——
  # 旧约束 pypdf>=4,<6 会把实测使用的 6.21.4 降级，且 pyyaml 等运行依赖缺失，
  # `pip install .` 装出未经 CI 验证的组合（power_apps_source 顶层 import yaml）。
  "pypdf>=6.21.4,<7",
  "pyyaml>=6,<7",
  "beautifulsoup4>=4.12,<5",
  "fpdf2>=2.8,<3",
  "Pillow>=10,<14",
  "numpy>=2,<3",
]

[project.optional-dependencies]
windows = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/ogowoo/gantry"
Repository = "https://github.com/ogowoo/gantry"
Changelog = "https://github.com/ogowoo/gantry/blob/main/CHANGELOG.md"

[project.scripts]
gantry = "gantry.cli:main"

[tool.setuptools]
packages = ["gantry"]

[tool.setuptools.package-data]
gantry = ["*.py"]
